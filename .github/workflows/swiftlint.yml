name: SwiftLint Code Quality

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - '**.swift'
  pull_request:
    branches: [ main ]
    paths:
      - '**.swift'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint Analysis
    runs-on: macos-latest
    timeout-minutes: 10

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: SwiftLint Version
        run: swiftlint version

      - name: Run SwiftLint
        run: |
          cd HaushaltsHero
          swiftlint lint --reporter github-actions-logging > swiftlint-report.txt || true
          swiftlint lint --reporter markdown > swiftlint-report.md || true

      - name: Generate SwiftLint Summary
        if: always()
        run: |
          cd HaushaltsHero
          if [ -f swiftlint-report.txt ]; then
            echo "## 🔍 SwiftLint Code Quality Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            WARNINGS=$(grep -c "warning:" swiftlint-report.txt || echo "0")
            ERRORS=$(grep -c "error:" swiftlint-report.txt || echo "0")

            echo "**Errors:** $ERRORS" >> $GITHUB_STEP_SUMMARY
            echo "**Warnings:** $WARNINGS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$ERRORS" -eq "0" ] && [ "$WARNINGS" -eq "0" ]; then
              echo "✅ **No issues found!**" >> $GITHUB_STEP_SUMMARY
            elif [ "$ERRORS" -eq "0" ]; then
              echo "⚠️ **Found $WARNINGS warnings.**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Found $ERRORS errors and $WARNINGS warnings.**" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Top Issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -20 swiftlint-report.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SwiftLint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: |
            HaushaltsHero/swiftlint-report.txt
            HaushaltsHero/swiftlint-report.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment SwiftLint Results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 SwiftLint Code Quality Report\n\n';

            try {
              const report = fs.readFileSync('HaushaltsHero/swiftlint-report.txt', 'utf8');
              const warnings = (report.match(/warning:/g) || []).length;
              const errors = (report.match(/error:/g) || []).length;

              comment += `**Errors:** ${errors}\n`;
              comment += `**Warnings:** ${warnings}\n\n`;

              if (errors === 0 && warnings === 0) {
                comment += '✅ **No issues found!**\n';
              } else if (errors === 0) {
                comment += `⚠️ **Found ${warnings} warnings.**\n`;
              } else {
                comment += `❌ **Found ${errors} errors and ${warnings} warnings.**\n`;
              }

              // Add top 10 issues
              const lines = report.split('\n').slice(0, 10);
              if (lines.length > 0) {
                comment += '\n### Top Issues\n\n```\n';
                comment += lines.join('\n');
                comment += '\n```\n';
              }
            } catch (e) {
              comment += '⚠️ Could not parse SwiftLint report.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
