name: iOS Build & Test

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

# Prevent concurrent runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test iOS App
    runs-on: macos-latest
    timeout-minutes: 30  # Increased timeout for iOS builds

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Cache Swift Package Manager
        uses: actions/cache@v3
        with:
          path: |
            HaushaltsHero/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build iOS App
        run: |
          cd HaushaltsHero
          xcodebuild clean build \
            -project HaushaltsHero.xcodeproj \
            -scheme HaushaltsHero \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
        timeout-minutes: 15

      - name: Run Unit Tests
        run: |
          cd HaushaltsHero
          xcodebuild test \
            -project HaushaltsHero.xcodeproj \
            -scheme HaushaltsHero \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
        timeout-minutes: 10

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            HaushaltsHero/TestResults
            HaushaltsHero/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore
