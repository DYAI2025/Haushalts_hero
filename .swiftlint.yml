# SwiftLint Configuration for Haushalts-Hero

# Paths to include/exclude
included:
  - HaushaltsHero/HaushaltsHero

excluded:
  - HaushaltsHero/HaushaltsHeroTests
  - HaushaltsHero/HaushaltsHeroUITests
  - HaushaltsHero/.build
  - HaushaltsHero/DerivedData
  - Pods

# Analyzer rules (opt-in)
analyzer_rules:
  - unused_declaration
  - unused_import

# Opt-in rules
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

# Disabled rules
disabled_rules:
  - trailing_whitespace  # Too strict for MVP
  - todo  # Allow TODOs during development

# Rule configurations

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

type_body_length:
  warning: 300
  error: 500

large_tuple:
  warning: 3
  error: 4

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - vm
    - url
    - db

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

# Force unwrapping (strict for production, lenient for MVP)
force_unwrapping:
  severity: warning  # Change to error for production

# Force cast (avoid in production)
force_cast:
  severity: warning

# Force try (avoid in production)
force_try:
  severity: warning

# Empty count (prefer isEmpty)
empty_count:
  severity: warning

# Trailing comma (enforce for better git diffs)
trailing_comma:
  mandatory_comma: true

# Custom rules
custom_rules:
  # Ensure async/await is used correctly
  avoid_force_unwrap_in_async:
    name: "Avoid force unwrap in async functions"
    regex: 'async\s+func\s+\w+\(.*\)\s+\{[\s\S]*!\s*\n'
    message: "Avoid force unwrapping in async functions. Use guard or if let instead."
    severity: warning

  # Encourage proper error handling
  avoid_empty_catch:
    name: "Avoid empty catch blocks"
    regex: 'catch\s*\{\s*\}'
    message: "Empty catch blocks should at least log the error."
    severity: warning

  # Repository pattern enforcement
  repository_naming:
    name: "Repository classes should end with 'Repository'"
    regex: 'class\s+(?!\w*Repository)\w+:\s*.*Repository'
    message: "Repository implementations should end with 'Repository'"
    severity: warning

# Reporter type (can be changed based on CI environment)
reporter: "github-actions-logging"
